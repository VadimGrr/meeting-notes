<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Живой конспект встречи</title>
<style>
:root {
    color-scheme: light;
    --bg: #ffffff;
    --panel: #ffffff;
    --panel-sub: #efefef;
    --border: #000000;
    --border-width: 4px;
    --radius: 0;
    --accent: #000000;
    --text: #111111;
    --muted: #555555;
    --arrow: #3a3a3a;
    --meter-track: #e8e8e8;
    --input-bg: #ffffff;
    --muted-bg: #ececec;
    --dot-idle: #cccccc;
}
body.dark {
    color-scheme: dark;
    background: #0f1117;
    color: #e6e8ee;
    --bg: #0f1117;
    --panel: #1a1d27;
    --panel-sub: #14161e;
    --border: #4a5670;
    --border-width: 3px;
    --radius: 0;
    --accent: #4f8cff;
    --text: #e6e8ee;
    --muted: #8b90a0;
    --arrow: #4f5a6b;
    --meter-track: #0a0c12;
    --input-bg: #1a1d27;
    --muted-bg: #2a2f3d;
    --dot-idle: #3a3f4e;
}
body.dark #transcript, body.dark #summary, body.dark #diag, body.dark #status-text { color: #e6e8ee; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: "Segoe UI", -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}
header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 24px;
    background: var(--panel);
    border-bottom: var(--border-width) solid var(--border);
}
header h1 { font-size: 18px; font-weight: 600; }
#status {
    font-size: 13px; color: var(--muted);
    display: flex; align-items: center; gap: 8px;
}
#dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--dot-idle); display: inline-block;
}
#dot.on { background: #f0a500; box-shadow: 0 0 8px #f0a500; animation: pulse 1s infinite; }
#dot.rec { background: #e5484d; box-shadow: 0 0 8px #e5484d; animation: pulse 0.6s infinite; }
@keyframes pulse { 50% { opacity: 0.5; } }
.spacer { flex: 1; }
button {
    background: var(--accent); color: white; border: none;
    padding: 8px 18px; font-size: 14px;
    cursor: pointer; transition: filter 0.15s;
}
button:hover { filter: brightness(1.1); }
button.secondary {
    background: var(--muted-bg); color: var(--text);
    border: var(--border-width) solid var(--border);
}
#mic-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 24px; background: var(--panel-sub);
    border-bottom: var(--border-width) solid var(--border);
}
#mic-row label { font-size: 13px; color: var(--muted); }
#mic-select {
    background: var(--input-bg); color: var(--text); border: var(--border-width) solid var(--border);
    padding: 6px 10px; font-size: 13px; max-width: 220px;
}
#mic-refresh {
    background: var(--input-bg); border: var(--border-width) solid var(--border);
    padding: 6px 12px;
}
#meter-wrap {
    margin-left: auto; display: flex; align-items: center; gap: 8px;
}
#meter-label { font-size: 11px; color: var(--muted); }
#meter {
    width: 160px; height: 12px; background: var(--meter-track);
    border: var(--border-width) solid var(--border); overflow: hidden;
}
#meter-fill {
    height: 100%; width: 0%; background: linear-gradient(90deg,#2ecc71,#f1c40f,#e74c3c);
    transition: width 0.08s ease-out;
}

main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    padding: 16px 24px;
    min-height: 0;
}
.panel {
    background: var(--panel);
    border: var(--border-width) solid var(--border);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
}
.panel h2 {
    display: flex; align-items: center;
    font-size: 13px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--muted); font-weight: 600;
    padding: 12px 16px; border-bottom: var(--border-width) solid var(--border);
}
.panel h2 .count {
    margin-left: auto; background: var(--muted-bg);
    padding: 2px 8px; font-size: 12px;
}
#transcript, #summary {
    flex: 1; overflow-y: auto; padding: 16px;
    font-size: 15px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
}
#transcript .interim { color: var(--muted); font-style: italic; }
#summary {
    color: var(--text); font-size: 14px; line-height: 1.7;
}
#summary h3 { color: var(--accent); margin: 14px 0 6px; font-size: 15px; }
#summary ul { padding-left: 22px; margin: 6px 0; }
#summary li { margin: 4px 0; }
#sum-meta { padding: 8px 16px; border-top: var(--border-width) solid var(--border); color: var(--muted); font-size: 13px; }
#sum-btn { align-self: center; margin: 10px; }
.empty { color: var(--muted); font-style: italic; }

/* ── Мобильные устройства (Android/телефон) ── */
@media (max-width: 800px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; gap: 10px; padding: 10px 12px; }
    header { flex-wrap: wrap; gap: 8px; padding: 10px 12px; }
    header h1 { font-size: 15px; width: 100%; }
    #status { font-size: 12px; }
    .spacer { flex: 1 1 100%; order: 2; }
    button { padding: 10px 20px; font-size: 15px; min-height: 44px; }
    #rec-btn { flex: 1; }
    #reset-btn { flex: 1; }
    #mic-row { flex-wrap: wrap; gap: 8px; padding: 8px 12px; }
    #mic-select { max-width: 100%; flex: 1; min-width: 0; }
    #meter-wrap { margin-left: 0; flex: 1 1 100%; }
    #meter { flex: 1; }
    #transcript, #summary { font-size: 16px; }
    .panel h2 { padding: 10px 12px; }
    #sum-btn { width: calc(100% - 24px); margin: 10px 12px; min-height: 44px; }
}
</style>
</head>
<body>
<header>
    <h1>Живой конспект встречи</h1>
    <div id="status"><span id="dot"></span><span id="status-text">Готово</span></div>
    <div class="spacer"></div>
    <button id="rec-btn" class="secondary" title="Начать / остановить">▶</button>
    <button id="reset-btn" class="secondary">Сброс</button>
    <button id="diag-btn" class="secondary" title="Показать лог распознавания">🐞</button>
    <button id="theme-btn" class="secondary" title="Сменить тему">☾</button>
    <button id="mic-toggle" class="secondary" title="Показать / скрыть панель микрофона">▾</button>
</header>
<pre id="diag" hidden></pre>
<div id="diag-copy" hidden><button id="diag-copy-btn">📋 Скопировать лог</button></div>

<div id="mic-row">
    <label for="mic-select">🎤 Микрофон:</label>
    <select id="mic-select"></select>
    <button id="mic-refresh" title="Обновить микрофоны">⟳</button>
    <div id="meter-wrap">
        <span id="meter-label">Уровень</span>
        <div id="meter"><div id="meter-fill"></div></div>
    </div>
</div>

<main>
    <section class="panel">
        <h2>Живой текст <span class="count" id="word-count">0 слов</span></h2>
        <div id="transcript"><span class="empty">Нажмите "Начать" и говорите в микрофон...</span></div>
    </section>
    <section class="panel">
        <h2>Конспект AI</h2>
        <button id="sum-btn">📝 Сгенерировать конспект</button>
        <div id="summary"><span class="empty">Текст появится после накопления речи и нажатия кнопки.</span></div>
        <div id="sum-meta"></div>
    </section>
</main>

<script>
const transcriptEl = document.getElementById('transcript');
const summaryEl = document.getElementById('summary');
const statusEl = document.getElementById('status-text');
const dotEl = document.getElementById('dot');
const recBtn = document.getElementById('rec-btn');
const resetBtn = document.getElementById('reset-btn');
const sumBtn = document.getElementById('sum-btn');
const wordCountEl = document.getElementById('word-count');
const sumMeta = document.getElementById('sum-meta');
const micSelect = document.getElementById('mic-select');
const micRefresh = document.getElementById('mic-refresh');
const meterFill = document.getElementById('meter-fill');
const diagBtn = document.getElementById('diag-btn');
const diagEl = document.getElementById('diag');
const diagCopyBtn = document.getElementById('diag-copy-btn');
const diagCopyWrap = document.getElementById('diag-copy');
const themeBtn = document.getElementById('theme-btn');
const micToggle = document.getElementById('mic-toggle');
const micRow = document.getElementById('mic-row');

function diag(...args) {
    const t = new Date().toISOString().slice(11, 23);
    const line = t + ' ' + args.join(' ');
    diagEl.textContent += (diagEl.textContent ? '\n' : '') + line;
    diagEl.scrollTop = diagEl.scrollHeight;
    console.debug(line);
}

function startWarnTimer() {
    clearWarnTimer();
    noResultTimer = setTimeout(() => {
        if (!recording || !wantRecord) return;
        setStatus('Нет текста — проверьте микрофон/интернет', '');
        diag('no-results-7s');
    }, 7000);
}

function clearWarnTimer() {
    if (noResultTimer) { clearTimeout(noResultTimer); noResultTimer = null; }
}
diagBtn.onclick = () => {
    const show = diagEl.hidden;
    diagEl.hidden = !show;
    diagCopyWrap.hidden = !show;
};
diagCopyBtn.onclick = async () => {
    try {
        await navigator.clipboard.writeText(diagEl.textContent);
        const old = diagCopyBtn.textContent;
        diagCopyBtn.textContent = '✓ Скопировано';
        setTimeout(() => { diagCopyBtn.textContent = old; }, 1500);
    } catch (e) {
        diagCopyBtn.textContent = 'Не удалось скопировать';
    }
};

let recognizer = null;
let stream = null;
let analyser = null;
let audioCtx = null;
let raf = null;
let recording = false;
let wantRecord = false;
let restartTimer = null;
let silentEnds = 0;
let lastResultAt = 0;
let noResultTimer = null;
let selectedMicId = null;
let finalText = '';
let interimText = '';

const GROQ_URL = 'https://meeting-notes.vadi714g.workers.dev/';

function setStatus(text, state) {
    statusEl.textContent = text;
    dotEl.className = state || '';
}

function updateWords() {
    const words = transcriptEl.innerText.trim().split(/\s+/).filter(Boolean).length;
    wordCountEl.textContent = words + ' слов';
}

function renderMarkdown(text) {
    let html = text
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const lines = html.split('\n');
    let out = '';
    let inList = false;
    for (const line of lines) {
        const m = line.match(/^\s*[-*]\s+(.*)/);
        const h = line.match(/^######?\s+(.*)/);
        if (m) {
            if (!inList) { out += '<ul>'; inList = true; }
            out += `<li>${m[1]}</li>`;
        } else {
            if (inList) { out += '</ul>'; inList = false; }
            if (h) out += `<h3>${h[1]}</h3>`;
            else if (line.trim()) out += `<p>${line}</p>`;
        }
    }
    if (inList) out += '</ul>';
    return out;
}

// ── Выбор микрофона ──────────────────────────
async function loadDevices() {
    try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
        const devices = await navigator.mediaDevices.enumerateDevices();
        const mics = devices.filter(d => d.kind === 'audioinput');
        if (!mics.length) { micSelect.innerHTML = '<option value="">Нет микрофонов</option>'; return; }
        const prevId = selectedMicId || micSelect.value;
        micSelect.innerHTML = '';
        mics.forEach((m, i) => {
            const label = m.label || `Микрофон ${i + 1}`;
            const opt = document.createElement('option');
            opt.value = m.deviceId;
            opt.textContent = label;
            micSelect.appendChild(opt);
        });
        const target = [...mics].find(m => m.deviceId === prevId);
        micSelect.value = prevId && target ? prevId : mics[0].deviceId;
    } catch (e) { console.warn('enum err', e); }
}

// ── Визуализация уровня ──────────────────────
function startMeter() {
    stopMeter();
    let t = 0;
    const draw = () => {
        // без отдельного потока микрофона показываем пульсацию-анимацию
        t += 0.04;
        const pct = 25 + 40 * (0.5 + 0.5 * Math.sin(t));
        meterFill.style.width = Math.min(100, pct) + '%';
        raf = requestAnimationFrame(draw);
    };
    draw();
}

function stopMeter() {
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    audioCtx = null;
    analyser = null;
    meterFill.style.width = '0%';
}

// ── Google Web Speech API ────────────────────
function pickRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert('Ваш браузер не поддерживает Web Speech API. Используйте Chrome или Edge.'); return null; }
    return new SR();
}

// Добавляет новый фрагмент в finalText, исключая повторы (Android шлёт их заново)
function appendDedup(t) {
    if (!t) return false;
    const norm = (s) => s.toLowerCase().replace(/[«»"'.,!?;:()]/g, '').trim();
    const nt = norm(t);
    if (!nt) return false;
    const tail = norm(finalText);
    const words = nt.split(/\s+/);
    // если новые слова полностью уже в конце — пропускаем (дубль)
    if (tail.endsWith(' ' + nt) || tail === nt) return false;
    // если совпадает последние min(3, все слова) с хвостом — тоже дубль
    const minLen = Math.min(words.length, 3);
    if (minLen > 0) {
        const prefix = words.slice(0, minLen).join(' ');
        if (tail.endsWith(' ' + prefix)) return false;
    }
    finalText = finalText ? finalText + ' ' + t : t;
    return true;
}

function start() {
    const r = pickRecognition();
    if (!r) return;
    recognizer = r;
    r.lang = 'ru-RU';
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 1;

    // НЕ держим отдельный поток микрофона (конфликтует с Web Speech на Android).
    // Показываем анимацию-пульсацию вместо реального уровня RMS.
    startMeter();

    r.onstart = () => { recording = true; silentEnds = 0; lastResultAt = Date.now(); setStatus('Слушаю...', 'rec'); recBtn.textContent = '■'; recBtn.classList.remove('secondary'); diag('onstart'); startWarnTimer(); };
    r.onresult = (e) => {
        interimText = '';
        clearWarnTimer();
        const added = [];
        for (let i = e.resultIndex; i < e.results.length; i++) {
            const res = e.results[i];
            const t = res[0].transcript.trim();
            if (res.isFinal) {
                added.push(t);
            } else {
                interimText += ' ' + t;
            }
        }
        lastResultAt = Date.now();
        diag('onresult', 'added=' + added.length, 'interimLen=' + interimText.length, added[0]);
        // Android часто присылает уже записанный фрагмент заново при перезапуске.
        // Дедуплицируем: не добавляем, если начало нового совпадает с хвостом уже записанного.
        for (const t of added) {
            if (appendDedup(t)) break;
        }
        renderTranscript();
        updateWords();
    };
    r.onerror = (e) => {
        console.warn('recog error', e.error);
        diag('onerror', e.error);
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
            setStatus('Нет доступа к микрофону', '');
            wantRecord = false;
            stop();
            return;
        }
        // network / no-speech / aborted — транзиентные, не останавливаем
        // просто оставляем ждать; onend перезапустит распознавание
        if (e.error === 'network') {
            setStatus('Переподключаюсь...', 'rec');
        }
    };
    r.onend = () => {
        diag('onend', 'want=' + wantRecord, 'recording=' + recording);
        // Google сама обрывает распознавание на тишине/сети — перезапускаем
        // (необходимо для непрерывной работы, особенно на Android и desktop)
        if (!wantRecord) return;
        // Chrome desktop не любит мгновенный старт сразу после onend — ждём 400мс
        if (restartTimer) clearTimeout(restartTimer);
        restartTimer = setTimeout(() => {
            if (!wantRecord || recognizer !== r) return;
            try {
                r.start();
                diag('restarted');
            } catch (err) {
                diag('restart-err', String(err));
            }
        }, 400);
    };

    wantRecord = true;
    diag('start', 'continuous=' + r.continuous);
    try {
        r.start();
        diag('started');
    } catch (err) {
        console.error(err);
        diag('start-err', String(err));
    }
}

function renderTranscript() {
    if (transcriptEl.querySelector('.empty')) transcriptEl.innerHTML = '';
    let html = escapeHtml(finalText);
    if (interimText) html += '<span class="interim">' + escapeHtml(interimText) + '</span>';
    transcriptEl.innerHTML = html;
    transcriptEl.scrollTop = transcriptEl.scrollHeight;
}

function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function stop() {
    recording = false;
    wantRecord = false;
    clearWarnTimer();
    if (restartTimer) { clearTimeout(restartTimer); restartTimer = null; }
    if (recognizer) {
        try { recognizer.abort(); } catch (e) { /* ignore */ }
        recognizer = null;
    }
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    stopMeter();
    recBtn.textContent = '▶';
    recBtn.classList.add('secondary');
    micSelect.disabled = false;
    micRefresh.disabled = false;
    renderTranscript();
    setStatus('Готово', 'on');
}

async function makeSummary() {
    const text = finalText.trim();
    if (!text) { sumMeta.textContent = 'Нет текста для конспекта.'; return; }
    if (text.split(/\s+/).length < 25) { sumMeta.textContent = 'Накопите больше текста (минимум ~25 слов).'; return; }
    sumMeta.textContent = 'Генерация конспекта...';
    const req = () => fetch(GROQ_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            temperature: 0.3,
            messages: [
                { role: 'system', content: 'Ты — ассистент, который превращает сырой текст живой речи в краткий структурированный конспект на русском. Выдели ключевые темы, решения и пункты списками. Кратко, без воды.' },
                { role: 'user', content: text }
            ]
        })
    });
    let lastErr = null;
    for (let attempt = 1; attempt <= 3; attempt++) {
        try {
            const resp = await req();
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.error?.message || 'HTTP ' + resp.status);
            const out = data.choices[0].message.content.trim();
            summaryEl.innerHTML = '';
            summaryEl.innerHTML = renderMarkdown(out);
            sumMeta.textContent = 'Готово';
            return;
        } catch (err) {
            lastErr = err;
            if (attempt < 3) {
                sumMeta.textContent = 'Повтор ' + attempt + '/3...';
                await new Promise(r => setTimeout(r, 2500 * attempt));
            }
        }
    }
    sumMeta.textContent = 'Ошибка конспекта: ' + lastErr.message + ' (сервис Groq перегружен). Повторите через пару минут.';
}

recBtn.onclick = () => recording ? stop() : start();
resetBtn.onclick = () => {
    finalText = '';
    interimText = '';
    transcriptEl.innerHTML = '<span class="empty">Нажмите "Начать" и говорите в микрофон...</span>';
    summaryEl.innerHTML = '<span class="empty">Текст появится после накопления речи и нажатия кнопки.</span>';
    wordCountEl.textContent = '0 слов';
    sumMeta.textContent = '';
};
sumBtn.onclick = makeSummary;
micSelect.onchange = () => { selectedMicId = micSelect.value; };
micRefresh.onclick = loadDevices;
themeBtn.onclick = () => {
    const dark = document.body.classList.toggle('dark');
    themeBtn.textContent = dark ? '☀' : '☾';
    try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
};
try {
    if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');
    themeBtn.textContent = document.body.classList.contains('dark') ? '☀' : '☾';
} catch (e) {}
micToggle.onclick = () => {
    const hidden = micRow.style.display === 'none';
    micRow.style.display = hidden ? 'flex' : 'none';
    micToggle.textContent = hidden ? '▾' : '▴';
    try { localStorage.setItem('micHidden', hidden ? '' : '1'); } catch (e) {}
};
try { if (localStorage.getItem('micHidden') === '1') { micRow.style.display = 'none'; micToggle.textContent = '▴'; } } catch (e) {}

// ── Разрешение на микрофон (чтобы enumerateDevices вернул метки) ──
navigator.mediaDevices && navigator.mediaDevices.getUserMedia({ audio: true })
    .then((s) => { s.getTracks().forEach(t => t.stop()); loadDevices(); })
    .catch(() => loadDevices());
</script>
</body>
</html>
